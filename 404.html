<!Doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Error-404</title>

    <style>
        .Error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .Error h1 {
            font-size: 150px;
            color: #1470af;
            text-align: center;
            vertical-align: middle;
            margin-bottom: 0px;
            margin-top: 0px;
        }
        .Error h3 {
            font-size: 40px;
            color: #1470af;
            text-align: center;
            vertical-align: middle;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        .Error p {
            font-size: 20px;
            color: #1470af;
            text-align: center;
            vertical-align: middle;
            margin-bottom: 0px;
        }
         .nav-bar {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            vertical-align: middle;
        }

        .nav-btn {
            color: #ffffff;
            text-decoration: none;
             font-size: 1.25rem;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 28px;
            background-color: #1470af;
             border: 1px solid #1470af;
             transition: all 0.3s ease;
            white-space: nowrap;
        }

         .nav-btn:hover,
          .nav-btn.active {
              background-color: #ffffff;
              color: #1470af;
             transform: translateY(-2px);
        }

    </style>
    </head>

    <body>
        <div class="Error">
            <h1>404</h1>
            <h3>This Page isn't in the dataset.</h3>
            <p>Nothing lives at this address - the route you followed doesn't</p>
            <p>match anything in the record.</p>
        </div>
        <div class="nav-bar">
        <a href="index.html" class="nav-btn">View Portfolio!</a>
        </div>
    </body

</html>
