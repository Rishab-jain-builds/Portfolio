    <style>
        .Error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .Error h1 {
            font-size: 150px;
            color: #FACC15;
            text-align: center;
            vertical-align: middle;
            margin-bottom: 0px;
            margin-top: 0px;
        }
        .Error h3 {
            font-size: 40px;
            color: #ffffff;
            text-align: center;
            vertical-align: middle;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        .Error p {
            font-size: 20px;
            color: #ffffff;
            text-align: center;
            vertical-align: middle;
            margin-bottom: 0px;
        }
         .nav-bar {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            vertical-align: middle;
        }

        .nav-btn {
            color: #062B1E;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 28px;
            background-color: #FACC15;
            border: 1px solid #062B1E;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

         .nav-btn:hover {
            background-color: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }

        :root {
      --portfolio-bg: #031C14;
      --portfolio-green: #062B1E;
      --portfolio-yellow: #FACC15;
      --portfolio-white: #F8FAFC;
    }

    html, body {
      min-height: 100%;
    }

    body {
      background: var(--portfolio-bg);
      color: var(--portfolio-white);
      position: relative;
      isolation: isolate;
    }

    .portfolio-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 90% 8%,
          rgba(163, 160, 0, 0.13), transparent 32%),
        radial-gradient(ellipse at 8% 90%,
          rgba(16, 185, 129, 0.10), transparent 35%),
        linear-gradient(125deg,
          #031C14 0%, #062B1E 52%, #031B13 100%);
    }

    .data-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Keep existing site sections above the decorative background. */
    .portfolio-container {
      position: relative;
      z-index: 1;
    }

    #loader {
      z-index: 10;
    }

    /* Resolve legacy layout/theme conflicts from styles.css. */
    body {
      display: block;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    .portfolio-container {
      width: min(100%, 1440px);
      margin: 0 auto;
      min-height: 100vh;
      background: transparent;
      color: var(--portfolio-white);
      box-shadow: none;
      opacity: 1;
    }

    .top-section { padding: 30px clamp(20px, 4vw, 56px) 20px; }
    .brand-name { color: var(--portfolio-white); }

    .social-icon:hover, .hamburger:hover {
      color: #062B1E;
      background: var(--portfolio-yellow);
    }
    .hamburger:hover span { background: #062B1E; }

        .footer {
      background: rgba(3, 28, 20, 0.92);
      border-top: 1px solid rgba(250, 204, 21, 0.35);
      padding: 24px clamp(20px, 4vw, 56px) 0;
    }
    .footer-logo { overflow-wrap: anywhere; }
    .last-row { padding: 18px 0 24px; gap: 12px; }

      .skill_cont {
      color: var(--portfolio-white);
      background: rgba(6, 43, 30, 0.72);
      border-top: 1px solid rgba(250, 204, 21, 0.22);
      border-bottom: 1px solid rgba(250, 204, 21, 0.14);
      padding: 42px clamp(20px, 4vw, 56px);
      align-items: center;
      gap: 24px;
      }

    @media (max-width: 768px) {
      .data-art { opacity: 0.35; }
    }

    /* Respect reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
    .data-art {
        transition: none;
    }
}
